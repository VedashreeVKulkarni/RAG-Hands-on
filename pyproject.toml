[project]
name = "rg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VEDASHREE V KULKARNI", email = "vedashree369@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.5",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "pypdf>=6.21.4",
]

[project.scripts]
rg = "rg:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
